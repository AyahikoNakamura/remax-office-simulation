<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>COMPASS データ復元 / バックアップ</title>
<style>
  body { font: 15px/1.7 "Hiragino Kaku Gothic ProN", sans-serif; color: #333;
         max-width: 760px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; color: #004283; border-left: 6px solid #cb0321; padding-left: 12px; }
  h2 { font-size: 17px; margin-top: 32px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 18px 20px; margin: 16px 0; }
  .warn { background: #fff5f6; border-color: #f0b8bf; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 6px;
           padding: 10px 18px; cursor: pointer; }
  .primary { background: #cb0321; color: #fff; }
  .ghost { background: #f0f0f0; color: #333; }
  table { border-collapse: collapse; margin-top: 10px; }
  td, th { border: 1px solid #e0e0e0; padding: 6px 12px; text-align: left; }
  th { background: #f7f7f7; }
  code { background: #f2f2f2; padding: 2px 5px; border-radius: 3px; }
  #log { white-space: pre-wrap; margin-top: 14px; }
  .note { color: #5a5a5a; font-size: 13.5px; }
</style>
</head>
<body>

<h1>COMPASS データ復元 / バックアップ</h1>

<p class="note">
  このページは <code>http://localhost:8770/backup/restore.html</code> から開いてください。
  COMPASS 本体と同じアドレス（オリジン）でないと、データを読み書きできません。
  現在のアドレス: <strong id="origin"></strong>
</p>

<h2>いまブラウザに入っているデータ</h2>
<div class="card">
  <div id="current">読み込み中…</div>
  <p><button class="ghost" id="dl">今の状態をバックアップとして保存（ダウンロード）</button></p>
</div>

<h2>バックアップから復元する</h2>
<div class="card warn">
  <p><strong>注意：復元すると、いま入っているデータは上書きされます。</strong>
     先に上のボタンで現在の状態を保存してから実行してください。</p>
  <p><input type="file" id="file" accept="application/json"></p>
  <p><button class="primary" id="restore" disabled>選んだファイルの内容で復元する</button></p>
</div>

<div id="log"></div>

<script>
const KEY_LABELS = {
  remaxActualSalesRows: "実績分析（売上CSV取込データ）",
  remaxRegisteredAgents: "登録エージェント",
  remaxHeadOfficePaymentSettings: "本部支払い設定",
  remaxSeminarMode: "セミナー表示のON/OFF",
  remaxSeminarFontPx: "セミナー表示の文字サイズ",
  remaxSelfOfficeName: "自社オフィス名"
};

const $ = (id) => document.getElementById(id);
$("origin").textContent = location.origin;

function countOf(key, raw) {
  try {
    const v = JSON.parse(raw);
    if (Array.isArray(v)) return v.length + " 件";
  } catch (e) {}
  return (raw || "").length + " 文字";
}

function snapshot() {
  const out = {};
  for (const k of Object.keys(localStorage)) out[k] = localStorage.getItem(k);
  return out;
}

function renderCurrent() {
  const data = snapshot();
  const keys = Object.keys(data);
  if (!keys.length) { $("current").innerHTML = "<strong>データがありません。</strong>"; return; }
  const rows = keys.map(k =>
    `<tr><td>${KEY_LABELS[k] || k}</td><td>${countOf(k, data[k])}</td><td><code>${k}</code></td></tr>`
  ).join("");
  $("current").innerHTML =
    `<table><tr><th>内容</th><th>量</th><th>キー</th></tr>${rows}</table>`;
}
renderCurrent();

$("dl").addEventListener("click", () => {
  const payload = JSON.stringify({
    savedAt: new Date().toISOString(),
    origin: location.origin,
    localStorage: snapshot()
  });
  const d = new Date();
  const stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
              + "-" + String(d.getDate()).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([payload], {type: "application/json"}));
  a.download = stamp + "_compass_localstorage.json";
  a.click();
  URL.revokeObjectURL(a.href);
  $("log").textContent = "ダウンロードフォルダに保存しました。"
    + "\nbackup/ フォルダへ移動しておくと、次回ここから復元できます。";
});

let pending = null;
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) { pending = null; $("restore").disabled = true; return; }
  try {
    const parsed = JSON.parse(await f.text());
    const store = parsed.localStorage || parsed;   // 素のキー辞書でも受け付ける
    if (typeof store !== "object") throw new Error("形式が違います");
    pending = store;
    $("restore").disabled = false;
    const lines = Object.keys(store)
      .map(k => `  ・${KEY_LABELS[k] || k}：${countOf(k, store[k])}`).join("\n");
    $("log").textContent = `読み込んだバックアップ（${parsed.savedAt || "日時不明"}）\n${lines}`;
  } catch (err) {
    pending = null; $("restore").disabled = true;
    $("log").textContent = "このファイルは読めませんでした：" + err.message;
  }
});

$("restore").addEventListener("click", () => {
  if (!pending) return;
  if (!confirm("いま入っているデータを、選んだバックアップの内容で上書きします。実行しますか？")) return;
  for (const [k, v] of Object.entries(pending)) localStorage.setItem(k, v);
  renderCurrent();
  $("log").textContent = "復元しました。COMPASS の画面を開き直してください。";
});
</script>

</body>
</html>
